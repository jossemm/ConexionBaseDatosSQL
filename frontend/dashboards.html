<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Avícola 360 | Centro de Analítica y Dashboards</title>
  <link rel="stylesheet" href="css/dashboard.css">
  
  <!-- Google Charts Loader -->
  <script type="text/javascript" src="https://www.gstatic.com/charts/loader.js"></script>
  <!-- D3.js v7 CDN -->
  <script src="https://d3js.org/d3.v7.min.js"></script>
</head>
<body class="dashboard-body">

  <!-- Sidebar Lateral -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <span class="icon">📊</span>
      <h2>Avícola 360</h2>
      <p class="subtitle">Granja El Pollón</p>
    </div>

    <nav class="sidebar-menu">
      <div class="menu-label">Google Charts (3)</div>
      <button class="dash-btn active" onclick="cambiarDashboard(1)">
        <span>🥚</span> 1. Producción Diaria
      </button>
      <button class="dash-btn" onclick="cambiarDashboard(2)">
        <span>🏷️</span> 2. Clasificación Huevo
      </button>
      <button class="dash-btn" onclick="cambiarDashboard(3)">
        <span>💵</span> 3. Ventas y Cobranza
      </button>

      <div class="menu-label">D3.js Avanzado (3)</div>
      <button class="dash-btn" onclick="cambiarDashboard(4)">
        <span>💉</span> 4. Sanidad / Vacunas
      </button>
      <button class="dash-btn" onclick="cambiarDashboard(5)">
        <span>🌾</span> 5. Stock de Insumos
      </button>
      <button class="dash-btn" onclick="cambiarDashboard(6)">
        <span>🏠</span> 6. Capacidad Galpones
      </button>
    </nav>

    <div class="sidebar-footer">
      <a href="index.html" class="btn-back">⬅ Regresar al Inicio</a>
    </div>
  </aside>

  <!-- Panel Principal -->
  <main class="main-dashboard">
    <header class="dash-header">
      <div>
        <h1 id="dash-title">Dashboard 1: Producción Diaria</h1>
        <p id="dash-engine" class="engine-badge">Motor: Google Charts</p>
      </div>
      <div class="status-indicator" id="db-status">
        <span class="status-dot"></span> <span id="status-text">Listo para conectar</span>
      </div>
    </header>

    <!-- Espacio Horizontal de Filtros Desagregados -->
    <section class="filtros-desagregados">
      <div class="filter-item search-box">
        <label>Buscador Inteligente:</label>
        <input type="text" id="filtro-busqueda" placeholder="Buscar por galpón, lote, cliente o fecha..." oninput="aplicarFiltros()">
      </div>
      <div class="filter-item">
        <label>Galpón / Sector:</label>
        <select id="filtro-galpon" onchange="aplicarFiltros()">
          <option value="todos">Todos los galpones</option>
          <option value="Galpón 01">Galpón 01</option>
          <option value="Galpón 02">Galpón 02</option>
          <option value="Galpón 03">Galpón 03</option>
          <option value="Galpón 04">Galpón 04</option>
          <option value="Galpón 05">Galpón 05</option>
        </select>
      </div>
      <div class="filter-item">
        <label>Rango Fecha:</label>
        <select id="filtro-fecha" onchange="aplicarFiltros()">
          <option value="todas">Todas las fechas</option>
          <option value="2026-10">Octubre 2026</option>
          <option value="2026-09">Septiembre 2026</option>
        </select>
      </div>
      <div class="filter-item reset-col">
        <button class="btn-reset" onclick="resetearFiltros()">Limpiar Filtros</button>
      </div>
    </section>

    <!-- Fila de Indicadores (KPIs) -->
    <section class="kpi-row" id="kpi-container"></section>

    <!-- Lienzo del Gráfico -->
    <section class="chart-wrapper">
      <div class="chart-header">
        <h3 id="chart-title">Visualización Gráfica</h3>
      </div>
      <div id="chart-canvas" class="chart-canvas"></div>
    </section>

    <!-- Tabla Detallada con Paginación -->
    <section class="table-wrapper">
      <div class="table-header">
        <h3>Registros de Detalle</h3>
        <span id="registros-count" class="badge-count">0 registros</span>
      </div>
      <div class="table-responsive">
        <table class="data-table">
          <thead id="tabla-head"></thead>
          <tbody id="tabla-body"></tbody>
        </table>
      </div>

      <div class="pagination-bar">
        <button id="btn-prev" onclick="cambiarPagina(-1)">Anterior</button>
        <span id="page-info">Página 1 de 1</span>
        <button id="btn-next" onclick="cambiarPagina(1)">Siguiente</button>
      </div>
    </section>
  </main>

  <!-- Scripts -->
  <script src="js/config.js"></script>
  <script src="js/dashboards-gc.js"></script>
  <script src="js/dashboards-d3.js"></script>
</body>
</html>
